name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]" ruff
      - run: ruff check .
      - run: ruff format --check src tests scripts
      - run: pytest -q

  sdk:
    name: Mistral SDK validation + end-to-end on Temporal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test,mistral]"
      - name: Fetch the Temporal Python samples
        run: git clone --depth 1 https://github.com/temporalio/samples-python.git /tmp/samples-python
      # test_e2e_temporal downloads Temporal's time-skipping test server from temporal.download
      - run: pytest -q -rs
        env:
          T2M_SAMPLES: /tmp/samples-python
      - name: Convert and validate the whole samples repository
        run: python scripts/validate_corpus.py /tmp/samples-python --out /tmp/converted --json corpus.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-validation
          path: |
            corpus.json
            /tmp/converted/_t2m_report.json
